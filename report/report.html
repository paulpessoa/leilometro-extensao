<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leilômetro — Relatório</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #111; background: #eef0f3; font-size: 14px; line-height: 1.5; }
    .barra { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 10px 20px; background: #0d1117; color: #e6edf3; }
    .barra b { font-family: ui-monospace, monospace; color: #f0ba32; }
    .barra .acoes { display: flex; gap: 8px; flex-wrap: wrap; }
    .barra button { font: inherit; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 7px; border: 1px solid #30363d; background: #21262d; color: #e6edf3; cursor: pointer; }
    .barra button.prim { background: #f0ba32; border-color: #f0ba32; color: #0d1117; }
    .barra button:disabled { opacity: .5; cursor: default; }
    .msg { padding: 8px 20px; font-size: 13px; background: #fff8e1; color: #795548; display: none; }
    .msg.on { display: block; }
    .folha { max-width: 800px; margin: 20px auto; background: #fff; padding: 36px 40px; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    .folha + .folha { page-break-before: always; }
    h1 { font-size: 20px; margin: 0 0 2px; }
    .sub { color: #777; font-size: 12px; margin-bottom: 18px; }
    .topo { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 14px; }
    .topo img { width: 180px; aspect-ratio: 4/3; object-fit: cover; border-radius: 8px; background: #eee; }
    .score-row { display: flex; align-items: center; gap: 14px; background: #f7f7f7; border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; flex: 1; }
    .sn { font-size: 42px; font-weight: 700; line-height: 1; }
    .oport { font-size: 11px; color: #888; }
    .oport strong { display: block; font-size: 18px; }
    .km-row { padding: 7px 12px; border-radius: 8px; margin-bottom: 18px; font-weight: 600; font-size: 13px; }
    .sec { margin-bottom: 18px; break-inside: avoid; }
    .stitle { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #999; margin-bottom: 6px; }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; vertical-align: top; }
    td:last-child { text-align: right; font-weight: 600; }
    .hl td { background: #fffde7; }
    .gold { color: #b8860b; } .green { color: #16a34a; } .red { color: #dc2626; } .amber { color: #d97706; }
    .notas, .ia { background: #f9f9f9; border: 1px solid #e5e5e5; border-radius: 8px; padding: 12px 14px; font-size: 13px; }
    .notas { white-space: pre-wrap; }
    .ia p { margin: 0 0 8px; } .ia ul { margin: 0 0 8px; padding-left: 18px; } .ia .md-h { font-weight: 700; margin-top: 10px; }
    .ia-meta { font-size: 10px; color: #999; margin-top: 6px; }
    .spark { width: 100%; height: 70px; }
    .aviso { background: #fff8e1; border: 1px solid #ffe082; border-radius: 8px; padding: 10px 12px; font-size: 11px; color: #795548; margin-top: 14px; }
    .rod { margin-top: 20px; padding-top: 10px; border-top: 1px solid #eee; font-size: 10px; color: #aaa; display: flex; justify-content: space-between; gap: 10px; }
    table.cmp th, table.cmp td { padding: 6px 8px; font-size: 12px; border-bottom: 1px solid #eee; text-align: left; }
    table.cmp td:last-child { text-align: left; }
    table.cmp th { background: #f7f7f7; font-weight: 600; }
    @media print {
      body { background: #fff; }
      .barra, .msg { display: none !important; }
      .folha { box-shadow: none; margin: 0; padding: 12px 6px; max-width: none; border-radius: 0; }
    }
    @media (max-width: 640px) { .folha { padding: 20px 16px; } .topo { flex-direction: column; } .topo img { width: 100%; } }
  </style>
</head>
<body>
  <div class="barra">
    <b>LEILÔMETRO · RELATÓRIO</b>
    <div class="acoes">
      <button id="gerarIa" hidden>🤖 Gerar parecer da IA</button>
      <button id="copiar">📋 Copiar texto</button>
      <button id="imprimir" class="prim">🖨️ Imprimir / PDF</button>
    </div>
  </div>
  <div class="msg" id="msg"></div>
  <div id="conteudo"></div>

  <script src="../lib/util.js"></script>
  <script src="../lib/calc.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="report.js"></script>
</body>
</html>
